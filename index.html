<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Shree Ganesh Provision Store</title>
  <link rel="stylesheet" href="login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">🛒</div>
    <h1 class="auth-title">Shree Ganesh<span>Admin Panel</span></h1>
    <p class="auth-subtitle">Apne admin account se login karo</p>

    <form id="loginForm" class="auth-form">
      <label>Email
        <input type="email" id="loginEmail" required placeholder="admin@shreeganesh.com" autocomplete="username" />
      </label>
      <label>Password
        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" />
      </label>
      <p class="auth-error" id="loginError"></p>
      <button type="submit" class="btn-admin btn-admin-gold btn-block">Login</button>
    </form>

    <button class="auth-toggle" onclick="window.location.href='signup.html'">Naya admin account banaye →</button>
    <a class="auth-back" href="../Customer/index.html">← Website pe wapas jaaye</a>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
